name: rifq
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  supabase_flutter: ^2.17.2
  ai_sdk_azure: ^2.0.0
  ai_sdk_dart: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/Rifq.png"
  web:
    generate: true
    image_path: "assets/Rifq.png"
    background_color: "#FFFFFF"
